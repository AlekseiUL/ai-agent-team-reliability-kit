[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-team-reliability-kit"
version = "0.1.0"
description = "Operating contracts, task templates, safety gates, and audit scripts for reliable AI agent teams."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Aleksei Ulianov / Sprut_AI"}]
keywords = ["ai-agents", "multi-agent", "agent-reliability", "kanban", "governance", "automation", "agent-teams"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
agent-team-reliability = "agent_team_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_team_reliability = ["py.typed"]
